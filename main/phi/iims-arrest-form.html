      <div class="body-wrapper">
        <div class="container-fluid">
          
          <!-- Banner -->
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3">
              <div class="row align-items-center">
                <div class="col-12">
                  <h4 class="fw-semibold mb-8">Arrest & Custody Entry</h4>
                  <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-enforcement.html">Enforcement</a></li>
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-arrested-list.html">Arrested Register</a></li>

                    </ol>
                  </nav>
                </div>
              </div>
            </div>

          <!-- Form Card -->
          <div class="card shadow-lg">
            <div class="card-body">
              <h5 class="fw-semibold mb-4 text-primary"><i class="ti ti-user-cancel me-2"></i>New Arrest Record</h5>
              
              <form onsubmit="event.preventDefault(); alert('Arrest custody record saved successfully!'); window.location.href='./iims-arrested-list.html';">
                <div class="row g-4">
                  
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Arrest ID</label>
                    <input type="text" class="form-control bg-light" value="ARR-2026-003" readonly>
                  </div>
                  
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Accused Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" placeholder="Enter full name of accused" required>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">NIC Number <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" placeholder="e.g. 198522104V or 199012345678" required>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Designation / Address</label>
                    <input type="text" class="form-control" placeholder="e.g. Outlet Manager or Residential address">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Date of Arrest <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" required>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Time of Arrest <span class="text-danger">*</span></label>
                    <input type="time" class="form-control" required>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Police Station involved</label>
                    <input type="text" class="form-control" placeholder="e.g. Borella Police Station">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Bail Status <span class="text-danger">*</span></label>
                    <select class="form-select" required>
                      <option value="">-- Select Bail Status --</option>
                      <option value="Remanded">Remanded</option>
                      <option value="Police Bail">Police Bail</option>
                      <option value="Court Bail">Court Bail</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Violation Basis <span class="text-danger">*</span></label>
                    <select class="form-select" required>
                      <option value="">-- Select Basis --</option>
                      <option value="Adulteration">Adulteration</option>
                      <option value="Expired Goods">Expired Goods</option>
                      <option value="Hygiene Failure">Hygiene Failure</option>
                      <option value="Statutory Act Violation">Statutory Act Violation</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Magistrate Order reference</label>
                    <input type="text" class="form-control" placeholder="e.g. MC/COL/8841/2026 (if applicable)">
                  </div>

                  <div class="col-md-12">
                    <label class="form-label fw-bold">Offense Description & Custody Remarks</label>
                    <textarea class="form-control" rows="4" placeholder="Detail the basis of custody, seized evidence, or court arguments..."></textarea>
                  </div>

                  <div class="col-12 mt-4">
                    <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
                      <button type="button" class="btn btn-outline-secondary" onclick="history.back()">Cancel</button>
                      <button type="submit" class="btn btn-primary px-4"><i class="ti ti-device-floppy me-1"></i>Save Arrest Record</button>
                    </div>
                  </div>

                </div>
              </form>

            </div>
          </div>

        </div>
      </div>
