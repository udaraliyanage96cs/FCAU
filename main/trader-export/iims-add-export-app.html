<!DOCTYPE html>

  <title>IIMS - Request Export Health Certificate</title>
</head>

    <div class="page-wrapper">
      <header class="topbar"><div class="with-vertical"><nav class="navbar navbar-expand-lg p-0"><ul class="navbar-nav"><li class="nav-item nav-icon-hover-bg rounded-circle ms-n2"><a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)"><i class="ti ti-menu-2"></i></a></li></ul><div class="d-block d-lg-none py-4 text-primary fw-bold fs-5 ps-3">IIMS</div><a class="navbar-toggler p-0 border-0 nav-icon-hover-bg rounded-circle" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#navbarNav"><i class="ti ti-dots fs-7"></i></a><div class="collapse navbar-collapse justify-content-end" id="navbarNav"><div class="d-flex align-items-center justify-content-between"><ul class="navbar-nav flex-row ms-auto align-items-center"><li class="nav-item"><img src="../../assets/images/profile/user-1.jpg" class="rounded-circle" width="35" height="35" alt="" /></li></ul></div></div></nav></div></header>

      <div class="body-wrapper">
        <div class="container-fluid">
          <!-- Page Header -->
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3">
              <div class="row align-items-center">
                <div class="col-9">
                  <h4 class="fw-semibold mb-8" id="pageTitle">Request Health Certificate</h4>
                  <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-exporter-registration.html">Home</a></li>
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-export-app.html">Health Certificates</a></li>
                      <li class="breadcrumb-item active" id="breadcrumbAction">Request Form</li>
                    </ol>
                  </nav>
                </div>
              </div>
            </div>
          </div>

          <!-- Application Form Card -->
          <div class="card shadow-lg border-top border-4 border-primary">
            <div class="card-body">
              <div class="text-center mb-4 pb-3 border-bottom">
                <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                  <img src="../../assets/images/logos/favicon.png" alt="Emblem" width="40" height="40" />
                  <h5 class="fw-bold text-dark mb-0">DEPARTMENT OF HEALTH SERVICES, SRI LANKA</h5>
                </div>
                <h4 class="fw-bold text-dark text-uppercase mb-2">Application for Health Certificate in Respect of Consignment of Food Intended for Export</h4>
                <p class="text-muted fs-2 italic mb-0">(To be submitted at least one week prior to shipment)</p>
              </div>

              <form id="hcForm" onsubmit="submitForm(event)">
                <!-- Administrative Metadata fields -->
                <div class="row g-3 mb-4 p-3 bg-light rounded border">
                  <div class="col-md-3">
                    <label class="form-label fw-semibold">Application No.</label>
                    <input type="text" id="formAppNo" class="form-control" placeholder="Autogenerated" readonly />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label fw-semibold">Certificate No.</label>
                    <input type="text" id="formCertNo" class="form-control" placeholder="Awaiting Issuance" readonly />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label fw-semibold">Cash Receipt No. <span class="text-danger">*</span></label>
                    <input type="text" id="formCashReceipt" class="form-control" placeholder="Receipt NO." required />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label fw-semibold">Health Dept. Reg. No. <span class="text-danger">*</span></label>
                    <div class="input-group">
                      <span class="input-group-text font-monospace fs-1 px-2">PA/EOH/FCAU/EXP/</span>
                      <input type="text" id="formDeptRegNo" class="form-control" placeholder="No." required />
                    </div>
                  </div>
                </div>

                <div class="row g-4">
                  <!-- 01. Applicant -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">01. Name and Address of the Applicant <span class="text-danger">*</span></label>
                    <textarea id="formApplicant" class="form-control" rows="3" placeholder="Enter applicant details..." required></textarea>
                  </div>

                  <!-- 02. Consignee -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">02. Name and Address of the Consignee <span class="text-danger">*</span></label>
                    <textarea id="formConsignee" class="form-control" rows="3" placeholder="Enter consignee details..." required></textarea>
                  </div>

                  <!-- 03. Description -->
                  <div class="col-md-12">
                    <label class="form-label fw-semibold">03. Description of consignment <span class="text-danger">*</span></label>
                    <textarea id="formDescription" class="form-control" rows="2" placeholder="List consignment description..." required></textarea>
                  </div>

                  <!-- 04. Date of intended Export -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">04. Date of intended Export <span class="text-danger">*</span></label>
                    <input type="date" id="formExportDate" class="form-control" required />
                  </div>

                  <!-- 05. L/C NO. -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">05. Letter of Credit (L/C) No. <span class="text-danger">*</span></label>
                    <input type="text" id="formLCNo" class="form-control" placeholder="e.g. LC/9932/2026" required />
                  </div>

                  <!-- 06. Container Numbers -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">06. Container Numbers (attach list if necessary)</label>
                    <input type="text" id="formContainers" class="form-control" placeholder="e.g. MSKU8839201" />
                  </div>

                  <!-- 07. Name of vessel/ Number -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">07. Name of Vessel / Vessel Number <span class="text-danger">*</span></label>
                    <input type="text" id="formVessel" class="form-control" placeholder="e.g. MSC Geneva V-42A" required />
                  </div>

                  <!-- 08. Address where Consignment is stored -->
                  <div class="col-md-8">
                    <label class="form-label fw-semibold">08. Address where Consignment is Stored <span class="text-danger">*</span></label>
                    <input type="text" id="formStorage" class="form-control" placeholder="Warehouse address..." required />
                  </div>

                  <!-- 09. Type of package, Batch code and Total weight -->
                  <div class="col-md-12">
                    <label class="form-label fw-semibold">09. Type of package, Batch code and Total weight <span class="text-danger">*</span></label>
                    <textarea id="formPackageDetails" class="form-control" rows="2" placeholder="e.g. 500 Cartons, Batch B-33, Total Weight: 12500 KG" required></textarea>
                  </div>

                  <!-- 10. Details of Ingredients used in Products -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">10. Details of Ingredients used in Products <span class="text-danger">*</span></label>
                    <textarea id="formIngredients" class="form-control" rows="3" placeholder="List ingredients details..." required></textarea>
                  </div>

                  <!-- 11. Details of in-house Quality monitoring -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">11. Details of in-house Quality monitoring <span class="text-danger">*</span></label>
                    <textarea id="formQuality" class="form-control" rows="3" placeholder="List quality monitoring checks..." required></textarea>
                  </div>

                  <!-- 12. Raw Materials and Product analysis certificate -->
                  <div class="col-md-6" id="formFileGroup">
                    <label class="form-label fw-semibold">12. Product Analysis Certificate (Attach PDF) <span class="text-danger">*</span></label>
                    <input type="file" id="formFile" class="form-control" required />
                  </div>

                  <!-- 13. Any Other declarations -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">13. Any Other declarations</label>
                    <input type="text" id="formDeclarations" class="form-control" placeholder="Additional declarations..." />
                  </div>

                  <div class="col-12 mt-4">
                    <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
                      <button type="button" class="btn btn-outline-secondary" onclick="window.location.href='./iims-export-app.html'">Cancel</button>
                      <button type="submit" class="btn btn-primary px-4" id="btnSubmit"><i class="ti ti-device-floppy me-1"></i>Submit Application</button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../../assets/js/vendor.min.js"></script>
  <script src="../../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/simplebar/dist/simplebar.min.js"></script>
  <script src="../../assets/js/theme/app.init.js"></script>
  <script src="../../assets/js/theme/theme.js"></script>
  <script src="../../assets/js/theme/app.min.js"></script>
  <script src="../../assets/js/theme/sidebarmenu.js"></script>
  <script src="./_role.js"></script>

  <script>
    var dummyData = {
      '26018': {
        appNo: 'EXP-HC-26018',
        certNo: 'HC-2026-9048',
        cashReceipt: 'CR-8829031',
        deptRegNo: '9923',
        applicant: 'Ceylon Spice Co.\nNo. 45, Galle Road, Colombo 03',
        consignee: 'Super Food Import GmbH\nSchumannstrasse 12, 10117 Berlin, Germany',
        description: 'Frozen Yellowfin Tuna Loins (CO Treated, Vacuum Packed)',
        exportDate: '2026-07-10',
        lcNo: 'LC-992-00389',
        containers: 'MSKU-882903-1',
        vessel: 'MSC Geneva V-42A',
        storage: 'Ocean Cold Stores, Colombo Port Sector 4',
        packageDetails: '500 Styrofoam Boxes, Batch Code: FT-26-03, Total weight: 12,500 KG',
        ingredients: 'Yellowfin Tuna (Thunnus albacares), salt, carbon monoxide (preservative)',
        quality: 'Temperature logs (under -18C), Histamine analysis, sensory inspections',
        declarations: 'Non-irradiated, catch area FAO 57'
      },
      '26017': {
        appNo: 'EXP-HC-26017',
        certNo: 'Awaiting Issuance',
        cashReceipt: 'CR-8829032',
        deptRegNo: '9924',
        applicant: 'Ceylon Spice Co.\nNo. 45, Galle Road, Colombo 03',
        consignee: 'Tokyo Fine Foods Corp\n5-Chome, Tsukiji, Chuo-ku, Tokyo, Japan',
        description: 'Organic Ceylon Cinnamon Quills (Grade Alba)',
        exportDate: '2026-07-15',
        lcNo: 'LC-102-3904',
        containers: 'NYKU-903829-5',
        vessel: 'Ocean Voyager V-12',
        storage: 'Ceylon Spice Processing Plant Warehouse, Puttalam',
        packageDetails: '200 Jute Bags, Batch Code: CIN-ALBA-26, Total weight: 4,800 KG',
        ingredients: '100% Organic Ceylon Cinnamon (Cinnamomum verum)',
        quality: 'Moisture monitoring (<12%), aflatoxin testing, sorting logs',
        declarations: 'Organic certified (USDA & EU), GMO-free'
      },
      '26016': {
        appNo: 'EXP-HC-26016',
        certNo: 'HC-2026-9040',
        cashReceipt: 'CR-8829029',
        deptRegNo: '9921',
        applicant: 'Ceylon Spice Co.\nNo. 45, Galle Road, Colombo 03',
        consignee: 'Global Food Distributors Inc\n120 Wall Street, New York, USA',
        description: 'Whole Organic Black Pepper (550 G/L)',
        exportDate: '2026-07-02',
        lcNo: 'LC-982-3902',
        containers: 'MAEU-293810-0',
        vessel: 'CMA CGM Express',
        storage: 'Ceylon Spice Processing Plant Warehouse, Puttalam',
        packageDetails: '310 Kraft Paper Bags, Batch Code: BP-WHOLE-02, Total weight: 6,200 KG',
        ingredients: 'Organic Whole Black Pepper (Piper niger)',
        quality: 'Sieve analysis, density checks, microbiology reports',
        declarations: 'Steam sterilized, pesticide-free'
      }
    };

    function initPage() {
      var params = new URLSearchParams(window.location.search);
      var viewId = params.get('view');

      if (viewId && dummyData[viewId]) {
        var data = dummyData[viewId];
        document.getElementById('pageTitle').textContent = 'View Health Certificate';
        document.getElementById('breadcrumbAction').textContent = 'View Details';
        
        document.getElementById('formAppNo').value = data.appNo;
        document.getElementById('formCertNo').value = data.certNo;
        document.getElementById('formCashReceipt').value = data.cashReceipt;
        document.getElementById('formDeptRegNo').value = data.deptRegNo;
        document.getElementById('formApplicant').value = data.applicant;
        document.getElementById('formConsignee').value = data.consignee;
        document.getElementById('formDescription').value = data.description;
        document.getElementById('formExportDate').value = data.exportDate;
        document.getElementById('formLCNo').value = data.lcNo;
        document.getElementById('formContainers').value = data.containers;
        document.getElementById('formVessel').value = data.vessel;
        document.getElementById('formStorage').value = data.storage;
        document.getElementById('formPackageDetails').value = data.packageDetails;
        document.getElementById('formIngredients').value = data.ingredients;
        document.getElementById('formQuality').value = data.quality;
        document.getElementById('formDeclarations').value = data.declarations;

        // Disable all inputs
        var inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(function(input) {
          input.disabled = true;
        });
        document.getElementById('formFileGroup').style.display = 'none';
        document.getElementById('btnSubmit').style.display = 'none';
      } else {
        document.getElementById('pageTitle').textContent = 'Request Health Certificate';
        document.getElementById('breadcrumbAction').textContent = 'Request Form';
        document.getElementById('formAppNo').value = 'EXP-HC-' + Math.floor(10000 + Math.random() * 90000);
        document.getElementById('formCertNo').value = 'Awaiting Issuance';
      }
    }

    function submitForm(event) {
      event.preventDefault();
      var appNo = document.getElementById('formAppNo').value;
      alert('Export Health Certificate application ' + appNo + ' submitted successfully!');
      window.location.href = './iims-export-app.html?newApp=' + encodeURIComponent(appNo) + 
                             '&date=' + encodeURIComponent(document.getElementById('formExportDate').value) +
                             '&commodity=' + encodeURIComponent(document.getElementById('formDescription').value) +
                             '&vessel=' + encodeURIComponent(document.getElementById('formVessel').value) +
                             '&consignee=' + encodeURIComponent(document.getElementById('formConsignee').value) +
                             '&weight=' + encodeURIComponent(document.getElementById('formPackageDetails').value.split(',').pop());
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
