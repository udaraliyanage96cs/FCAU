<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light" data-color-theme="Blue_Theme" data-layout="vertical">
<head>
  <meta charset="UTF-8" /><meta http-equiv="X-UA-Compatible" content="IE=edge" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" type="image/png" href="../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <title>IIMS - Login</title>
  <style>
    .auth-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a5f 0%,#2d5a8e 50%,#1a73e8 100%)}
    .auth-card{max-width:480px;width:100%;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .auth-header{background:linear-gradient(135deg,#0d47a1,#1565c0);padding:40px 30px 30px;text-align:center;color:#fff}
    .auth-header img{width:60px;margin-bottom:12px}
    .auth-body{padding:30px}
    .role-selector .form-check{border:2px solid #e9ecef;border-radius:10px;padding:12px 16px 12px 40px;margin-bottom:8px;transition:all .2s;cursor:pointer}
    .role-selector .form-check:hover{border-color:#5D87FF;background:#f0f6ff}
    .role-selector .form-check-input:checked~.form-check-label{color:#5D87FF;font-weight:600}
    .role-selector .form-check:has(.form-check-input:checked){border-color:#5D87FF;background:#f0f6ff}
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card card mb-0">
      <div class="auth-header">
        <img src="../assets/images/logos/favicon.png" alt="FCAU">
        <h3 class="fw-bold mb-1">FCAU IIMS</h3>
        <p class="mb-0 opacity-75">Interoperable Risk-based Food Safety Inspection<br>Information Management System</p>
      </div>
      <div class="auth-body">
        <h5 class="fw-semibold mb-1">Welcome Back</h5>
        <p class="text-muted mb-4 fs-2">Sign in to access the management portal</p>

        <div class="mb-3">
          <label class="form-label fw-semibold">Email / Username</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent"><i class="ti ti-user"></i></span>
            <input type="text" class="form-control" placeholder="Enter your email or username" value="phi.perera@fcau.gov.lk">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent"><i class="ti ti-lock"></i></span>
            <input type="password" class="form-control" placeholder="Enter your password" value="••••••••">
            <button class="btn btn-outline-secondary" type="button"><i class="ti ti-eye"></i></button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Login As (Role)</label>
          <div class="role-selector">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="role" id="rolePHI" checked>
              <label class="form-check-label" for="rolePHI"><i class="ti ti-clipboard-check me-2"></i>Public Health Inspector (PHI)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="role" id="roleMOH">
              <label class="form-check-label" for="roleMOH"><i class="ti ti-stethoscope me-2"></i>Medical Officer of Health (MOH)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="role" id="roleFDI">
              <label class="form-check-label" for="roleFDI"><i class="ti ti-package-import me-2"></i>Food & Drug Inspector (FDI)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="role" id="roleRD">
              <label class="form-check-label" for="roleRD"><i class="ti ti-building-community me-2"></i>Regional Director (RD)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="role" id="roleAdmin">
              <label class="form-check-label" for="roleAdmin"><i class="ti ti-shield-check me-2"></i>FCAU Administrator</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="role" id="roleFBO">
              <label class="form-check-label" for="roleFBO"><i class="ti ti-building-store me-2"></i>Food Business Operator (FBO)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="role" id="roleLab">
              <label class="form-check-label" for="roleLab"><i class="ti ti-test-pipe me-2"></i>Laboratory Analyst</label>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" checked>
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="javascript:void(0)" class="text-primary fs-2">Forgot Password?</a>
        </div>

        <a href="./iims-dashboard.html" class="btn btn-primary w-100 mb-3 py-2 fw-semibold"><i class="ti ti-login me-1"></i>Sign In</a>

        <div class="text-center">
          <p class="text-muted fs-2 mb-1">New Food Business Operator?</p>
          <a href="./iims-fbo-registration.html" class="text-primary fw-semibold fs-2">Register Your Premises</a>
        </div>

        <hr class="my-3">
        <div class="text-center">
          <small class="text-muted">Food Control Administration Unit (FCAU) &copy; 2026</small><br>
          <small class="text-muted">Ministry of Health, Sri Lanka</small>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
