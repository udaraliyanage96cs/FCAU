<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light" data-color-theme="Blue_Theme" data-layout="vertical">
<head>
  <meta charset="UTF-8" /><meta http-equiv="X-UA-Compatible" content="IE=edge" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" type="image/png" href="../../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <title>IIMS - Laboratory Triage</title>
</head>
<body class="link-sidebar">
  <div class="preloader"><img src="../../assets/images/logos/favicon.png" alt="loader" class="lds-ripple img-fluid" /></div>
  <div id="main-wrapper">
    <aside class="left-sidebar with-vertical"><div>
      <div class="brand-logo d-flex align-items-center justify-content-between">
          <a href="./iims-dashboard.html" class="text-nowrap logo-img text-primary fw-bold fs-6 ps-3">
            IIMS
          </a>
          <a href="javascript:void(0)" class="sidebartoggler ms-auto text-decoration-none fs-5 d-block d-xl-none">
            <i class="ti ti-x"></i>
          </a>
        </div>
      <nav class="sidebar-nav scroll-sidebar" data-simplebar><ul id="sidebarnav">
        <!-- Sidebar links will be injected by _role.js -->
      </ul></nav>
      
    </div></aside>

    <div class="page-wrapper">
      <header class="topbar"><div class="with-vertical"><nav class="navbar navbar-expand-lg p-0"><ul class="navbar-nav"><li class="nav-item nav-icon-hover-bg rounded-circle ms-n2"><a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)"><i class="ti ti-menu-2"></i></a></li></ul><div class="d-block d-lg-none py-4 text-primary fw-bold fs-5 ps-3">IIMS</div><a class="navbar-toggler p-0 border-0 nav-icon-hover-bg rounded-circle" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#navbarNav"><i class="ti ti-dots fs-7"></i></a><div class="collapse navbar-collapse justify-content-end" id="navbarNav"><div class="d-flex align-items-center justify-content-between"><ul class="navbar-nav flex-row ms-auto align-items-center"><li class="nav-item"><img src="../../assets/images/profile/user-1.jpg" class="rounded-circle" width="35" height="35" alt="" /></li></ul></div></div></nav></div></header>

      <div class="body-wrapper">
        <div class="container-fluid">
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3">
              <div class="row align-items-center">
                <div class="col-9">
                  <h4 class="fw-semibold mb-8">Laboratory Reception & Triage</h4>
                  <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-dashboard.html">Home</a></li>
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-received-samples.html">Received Samples</a></li>
                      <li class="breadcrumb-item active">Sample Triage</li>
                    </ol>
                  </nav>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-lg-8">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title fw-semibold mb-4" id="sample-title">Sample Integrity Verification</h5>
                  <div class="row mb-4">
                    <div class="col-md-6">
                      <p class="mb-1 fw-semibold text-muted fs-2">Sample Commodity</p>
                      <h6 class="mb-0" id="sample-commodity">-</h6>
                    </div>
                    <div class="col-md-6">
                      <p class="mb-1 fw-semibold text-muted fs-2">Source / Establishment</p>
                      <h6 class="mb-0" id="sample-source">-</h6>
                    </div>
                    <div class="col-md-6 mt-3">
                      <p class="mb-1 fw-semibold text-muted fs-2">Collection Date & Temp</p>
                      <h6 class="mb-0" id="sample-datetime">-</h6>
                    </div>
                    <div class="col-md-6 mt-3">
                      <p class="mb-1 fw-semibold text-muted fs-2">Chain of Custody Status</p>
                      <h6><span class="badge bg-success-subtle text-success">Secure - QR Scanned</span></h6>
                    </div>
                  </div>

                  <hr>

                  <h6 class="fw-semibold mb-3">Triage Checklist</h6>
                  <div class="list-group list-group-flush" id="triage-checklist">
                    <label class="list-group-item d-flex gap-2"><input class="form-check-input flex-shrink-0" type="checkbox" id="check-seal" checked><span>Seal is intact and matches the digital record</span></label>
                    <label class="list-group-item d-flex gap-2"><input class="form-check-input flex-shrink-0" type="checkbox" id="check-qty" checked><span>Quantity is sufficient for requested tests</span></label>
                    <label class="list-group-item d-flex gap-2"><input class="form-check-input flex-shrink-0" type="checkbox" id="check-temp" checked><span>Storage conditions maintained during transport</span></label>
                    <label class="list-group-item d-flex gap-2"><input class="form-check-input flex-shrink-0" type="checkbox" id="check-doc" checked><span>Documentation is complete and legible</span></label>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-lg-4">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title fw-semibold mb-4" id="action-title">Reception Action</h5>
                  <form id="triage-form">
                    <div class="mb-3">
                      <label class="form-label">Triage Determination</label>
                      <select class="form-select" id="triage-determination">
                        <option value="Accepted">Accept for Testing (Formal Intake)</option>
                        <option value="Rejected (Incorrect Temp/Seal Broken)">Reject Sample (Incorrect Temp/Seal Broken)</option>
                        <option value="Rejected (Insufficient Quantity)">Reject Sample (Insufficient Quantity)</option>
                        <option value="Rejected (Request Clarification)">Request Clarification from PHI</option>
                      </select>
                    </div>
                    <div class="mb-3" id="analyst-assignment-group">
                      <label class="form-label">Assign Laboratory Analyst</label>
                      <select class="form-select" id="assigned-analyst">
                        <option value="Unassigned">Select Analyst...</option>
                        <option value="Dr. Priyantha Bandara">Dr. Priyantha Bandara (Senior Microbiologist)</option>
                        <option value="Mrs. Sanduni Alwis">Mrs. Sanduni Alwis (Chemical Analyst)</option>
                        <option value="Mr. Ruwan Wijesinghe">Mr. Ruwan Wijesinghe (Food Technologist)</option>
                        <option value="Ms. Dilani Perera">Ms. Dilani Perera (Lab Technician)</option>
                      </select>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Internal Lab Tracking ID</label>
                      <input type="text" class="form-control" id="lab-id" placeholder="e.g. LAB-COL-2026-991" required>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Triage Remarks</label>
                      <textarea class="form-control" id="triage-remarks" rows="3" placeholder="Enter notes..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btn-submit"><i class="ti ti-check me-1"></i>Finalize Triage</button>
                    <a href="./iims-received-samples.html" class="btn btn-outline-secondary w-100 mt-2">Back to Register</a>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../assets/js/vendor.min.js"></script>
  <script src="../../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/simplebar/dist/simplebar.min.js"></script>
  <script src="../../assets/js/theme/app.init.js"></script>
  <script src="../../assets/js/theme/theme.js"></script>
  <script src="../../assets/js/theme/app.min.js"></script>
  <script src="../../assets/js/theme/sidebarmenu.js"></script>

  <script>
    let currentSample = null;
    let samplesList = [];

    function toggleAnalystSelect() {
      const determination = document.getElementById('triage-determination').value;
      const group = document.getElementById('analyst-assignment-group');
      if (determination === 'Accepted') {
        group.style.display = 'block';
      } else {
        group.style.display = 'none';
        document.getElementById('assigned-analyst').value = 'Unassigned';
      }
    }

    function loadSample() {
      const urlParams = new URLSearchParams(window.location.search);
      const sampleId = urlParams.get('id') || 'SPL-2026-0044';

      samplesList = JSON.parse(localStorage.getItem('fcau_received_samples')) || [];
      currentSample = samplesList.find(s => s.id === sampleId);

      if (!currentSample) {
        // Fallback or alert if not found
        alert('Sample not found in register.');
        window.location.href = './iims-received-samples.html';
        return;
      }

      // Populate static fields
      document.getElementById('sample-title').textContent = `Sample Integrity Verification: #${currentSample.id}`;
      document.getElementById('sample-commodity').textContent = currentSample.commodity;
      document.getElementById('sample-source').textContent = currentSample.source;
      document.getElementById('sample-datetime').textContent = `${currentSample.date} | ${currentSample.temp}`;

      if (currentSample.status !== 'Pending Triage') {
        // Sample already triaged, display in read-only state
        document.getElementById('action-title').textContent = 'Reception Action (Submitted)';
        document.getElementById('triage-determination').value = currentSample.status.startsWith('Accepted') ? 'Accepted' : currentSample.status;
        document.getElementById('triage-determination').disabled = true;

        document.getElementById('assigned-analyst').value = currentSample.assignedAnalyst || 'Unassigned';
        document.getElementById('assigned-analyst').disabled = true;

        document.getElementById('lab-id').value = currentSample.internalId || '';
        document.getElementById('lab-id').disabled = true;

        document.getElementById('triage-remarks').value = currentSample.remarks || '';
        document.getElementById('triage-remarks').disabled = true;

        // Disable checkboxes
        document.getElementById('check-seal').disabled = true;
        document.getElementById('check-qty').disabled = true;
        document.getElementById('check-temp').disabled = true;
        document.getElementById('check-doc').disabled = true;

        // Hide finalize button
        document.getElementById('btn-submit').style.display = 'none';
      }

      toggleAnalystSelect();
    }

    document.getElementById('triage-determination').addEventListener('change', toggleAnalystSelect);

    document.getElementById('triage-form').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!currentSample) return;

      const determination = document.getElementById('triage-determination').value;
      const assignedAnalyst = document.getElementById('assigned-analyst').value;
      const internalId = document.getElementById('lab-id').value;
      const remarks = document.getElementById('triage-remarks').value;

      // Update current sample state
      currentSample.status = determination;
      currentSample.assignedAnalyst = determination === 'Accepted' ? assignedAnalyst : 'Unassigned';
      currentSample.internalId = internalId;
      currentSample.remarks = remarks;

      // Save back to list
      const idx = samplesList.findIndex(s => s.id === currentSample.id);
      if (idx !== -1) {
        samplesList[idx] = currentSample;
      }
      localStorage.setItem('fcau_received_samples', JSON.stringify(samplesList));

      // Show success alert and redirect
      alert(`Sample ${currentSample.id} triaged successfully as "${determination}"`);
      window.location.href = './iims-received-samples.html';
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadSample();
    });
  </script>
  <script src="./_role.js"></script>
</body>
</html>
