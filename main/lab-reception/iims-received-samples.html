<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light" data-color-theme="Blue_Theme" data-layout="vertical">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" type="image/png" href="../../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <title>IIMS - Received Samples Grid</title>
</head>
<body class="link-sidebar">
  <div class="preloader"><img src="../../assets/images/logos/favicon.png" alt="loader" class="lds-ripple img-fluid" /></div>
  <div id="main-wrapper">
    <aside class="left-sidebar with-vertical">
      <div>
        <div class="brand-logo d-flex align-items-center justify-content-between">
          <a href="./iims-dashboard.html" class="text-nowrap logo-img text-primary fw-bold fs-6 ps-3">
            IIMS
          </a>
          <a href="javascript:void(0)" class="sidebartoggler ms-auto text-decoration-none fs-5 d-block d-xl-none">
            <i class="ti ti-x"></i>
          </a>
        </div>
        <nav class="sidebar-nav scroll-sidebar" data-simplebar>
          <ul id="sidebarnav">
            <!-- Sidebar links will be injected by _role.js -->
          </ul>
        </nav>
      </div>
    </aside>

    <div class="page-wrapper">
      <header class="topbar">
        <div class="with-vertical">
          <nav class="navbar navbar-expand-lg p-0">
            <ul class="navbar-nav">
              <li class="nav-item nav-icon-hover-bg rounded-circle ms-n2"><a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)"><i class="ti ti-menu-2"></i></a></li>
            </ul>
            <div class="d-block d-lg-none py-4 text-primary fw-bold fs-5 ps-3">IIMS</div>
            <a class="navbar-toggler p-0 border-0 nav-icon-hover-bg rounded-circle" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#navbarNav"><i class="ti ti-dots fs-7"></i></a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
              <div class="d-flex align-items-center justify-content-between">
                <ul class="navbar-nav flex-row ms-auto align-items-center">
                  <li class="nav-item nav-icon-hover-bg rounded-circle">
                    <a class="nav-link position-relative" href="./iims-alerts.html">
                      <i class="ti ti-bell-ringing"></i>
                      <div class="notification bg-primary rounded-circle"></div>
                    </a>
                  </li>
                  <li class="nav-item"><img src="../../assets/images/profile/user-1.jpg" class="rounded-circle" width="35" height="35" alt="" /></li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
      </header>

      <div class="body-wrapper">
        <div class="container-fluid">
          <!-- Breadcrumb -->
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3">
              <div class="row align-items-center">
                <div class="col-9">
                  <h4 class="fw-semibold mb-8">Received Samples Register</h4>
                  <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-dashboard.html">Home</a></li>
                      <li class="breadcrumb-item active">Received Samples</li>
                    </ol>
                  </nav>
                </div>
              </div>
            </div>
          </div>

          <!-- Summary cards -->
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <div class="card bg-warning-subtle shadow-none mb-0">
                <div class="card-body p-3 d-flex align-items-center gap-3">
                  <div class="round-40 rounded-circle bg-warning text-white d-flex align-items-center justify-content-center">
                    <i class="ti ti-clock fs-5"></i>
                  </div>
                  <div>
                    <h5 class="fw-semibold mb-0" id="count-pending">0</h5>
                    <span class="text-muted fs-2">Awaiting Triage</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card bg-success-subtle shadow-none mb-0">
                <div class="card-body p-3 d-flex align-items-center gap-3">
                  <div class="round-40 rounded-circle bg-success text-white d-flex align-items-center justify-content-center">
                    <i class="ti ti-check fs-5"></i>
                  </div>
                  <div>
                    <h5 class="fw-semibold mb-0" id="count-accepted">0</h5>
                    <span class="text-muted fs-2">Accepted Samples</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card bg-danger-subtle shadow-none mb-0">
                <div class="card-body p-3 d-flex align-items-center gap-3">
                  <div class="round-40 rounded-circle bg-danger text-white d-flex align-items-center justify-content-center">
                    <i class="ti ti-x fs-5"></i>
                  </div>
                  <div>
                    <h5 class="fw-semibold mb-0" id="count-rejected">0</h5>
                    <span class="text-muted fs-2">Rejected Samples</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Filter & Table Card -->
          <div class="card">
            <div class="card-body">
              <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center justify-content-between gap-3 mb-4">
                <h5 class="card-title fw-semibold mb-0">Samples Grid</h5>
                <div class="d-flex gap-2">
                  <select class="form-select form-select-sm" id="filter-status" style="width:160px;" onchange="renderGrid()">
                    <option value="All">All Statuses</option>
                    <option value="Pending Triage">Pending Triage</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Rejected">Rejected</option>
                  </select>
                  <button class="btn btn-sm btn-outline-success"><i class="ti ti-download me-1"></i>Export</button>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Sample ID</th>
                      <th>Ref. Number</th>
                      <th>Commodity</th>
                      <th>Sender/Source</th>
                      <th>Received Date</th>
                      <th>Transit Temp</th>
                      <th>Triage Status</th>
                      <th>Assigned Analyst</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="samples-grid-tbody">
                    <!-- Dynamic -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/vendor.min.js"></script>
  <script src="../../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/simplebar/dist/simplebar.min.js"></script>
  <script src="../../assets/js/theme/app.init.js"></script>
  <script src="../../assets/js/theme/theme.js"></script>
  <script src="../../assets/js/theme/app.min.js"></script>
  <script src="../../assets/js/theme/sidebarmenu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>

  <script>
    const defaultSamples = [
      { id: "SPL-2026-0044", refNo: "2026/PHI/COL/044", commodity: "Frozen Chicken Wings", source: "Golden Rice Restaurant", date: "2026-05-05", temp: "-18°C", status: "Pending Triage", assignedAnalyst: "Unassigned" },
      { id: "SPL-2026-0045", refNo: "2026/PHI/COL/045", commodity: "Packaged Rice", source: "City Bakery & Confections", date: "2026-05-02", temp: "Ambient (24°C)", status: "Pending Triage", assignedAnalyst: "Unassigned" },
      { id: "SPL-2026-0046", refNo: "2026/PHI/COL/046", commodity: "Frozen Prawns", source: "Harbor Fish Market", date: "2026-05-03", temp: "-15°C", status: "Accepted", internalId: "LAB-COL-2026-988", remarks: "Integrity verified; cold chain was intact.", assignedAnalyst: "Mrs. Sanduni Alwis" },
      { id: "SPL-2026-0047", refNo: "2026/PHI/COL/047", commodity: "Cooking Oil", source: "Fresh Mart Supermarket", date: "2026-05-04", temp: "Ambient (25°C)", status: "Accepted", internalId: "LAB-COL-2026-989", remarks: "Intact seal, acceptable routine sample.", assignedAnalyst: "Dr. Priyantha Bandara" }
    ];

    function initData() {
      if (!localStorage.getItem('fcau_received_samples')) {
        localStorage.setItem('fcau_received_samples', JSON.stringify(defaultSamples));
      }
    }

    function renderGrid() {
      const samples = JSON.parse(localStorage.getItem('fcau_received_samples')) || [];
      const filter = document.getElementById('filter-status').value;
      const tbody = document.getElementById('samples-grid-tbody');
      tbody.innerHTML = '';

      let pending = 0, accepted = 0, rejected = 0;

      samples.forEach(s => {
        if (s.status === 'Pending Triage') pending++;
        else if (s.status.includes('Accepted')) accepted++;
        else if (s.status.includes('Rejected')) rejected++;
      });

      document.getElementById('count-pending').textContent = pending;
      document.getElementById('count-accepted').textContent = accepted;
      document.getElementById('count-rejected').textContent = rejected;

      const filtered = samples.filter(s => filter === 'All' || s.status.startsWith(filter));

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-3 text-muted">No samples matching filter found.</td></tr>`;
        return;
      }

      filtered.forEach(s => {
        let statusBadge = '';
        let actionBtn = '';

        if (s.status === 'Pending Triage') {
          statusBadge = `<span class="badge bg-warning-subtle text-warning"><i class="ti ti-clock me-1"></i>Pending</span>`;
          actionBtn = `<a href="./iims-lab-triage.html?id=${s.id}" class="btn btn-sm btn-primary"><i class="ti ti-microscope me-1"></i>Perform Triage</a>`;
        } else if (s.status.startsWith('Accepted')) {
          statusBadge = `<span class="badge bg-success-subtle text-success"><i class="ti ti-check me-1"></i>Accepted</span>`;
          actionBtn = `<a href="./iims-lab-triage.html?id=${s.id}" class="btn btn-sm btn-outline-secondary"><i class="ti ti-eye me-1"></i>View Details</a>`;
        } else {
          statusBadge = `<span class="badge bg-danger-subtle text-danger"><i class="ti ti-x me-1"></i>Rejected</span>`;
          actionBtn = `<a href="./iims-lab-triage.html?id=${s.id}" class="btn btn-sm btn-outline-secondary"><i class="ti ti-eye me-1"></i>View Details</a>`;
        }

        let analystStr = '';
        if (s.status.startsWith('Accepted')) {
          if (!s.assignedAnalyst || s.assignedAnalyst === 'Unassigned') {
            analystStr = `<span class="badge bg-warning-subtle text-warning"><i class="ti ti-user-exclamation me-1"></i>Unassigned</span>`;
          } else {
            analystStr = `<span class="badge bg-info-subtle text-info"><i class="ti ti-user me-1"></i>${s.assignedAnalyst}</span>`;
          }
        } else {
          analystStr = `<span class="text-muted">-</span>`;
        }

        tbody.innerHTML += `
          <tr>
            <td><span class="fw-semibold text-dark">${s.id}</span></td>
            <td><code>${s.refNo}</code></td>
            <td>${s.commodity}</td>
            <td><span class="fw-semibold text-muted">${s.source}</span></td>
            <td>${s.date}</td>
            <td><span class="badge bg-light text-dark">${s.temp}</span></td>
            <td>${statusBadge}</td>
            <td>${analystStr}</td>
            <td>${actionBtn}</td>
          </tr>
        `;
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initData();
      renderGrid();
    });
  </script>
  <script src="./_role.js"></script>
</body>
</html>
