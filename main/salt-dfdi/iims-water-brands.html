</head>
<body class="link-sidebar">
  <div class="preloader"><img src="../../assets/images/logos/favicon.png" alt="loader" class="lds-ripple img-fluid" /></div>
  <div id="main-wrapper">
    <aside class="left-sidebar with-vertical"><div>
      <div class="brand-logo d-flex align-items-center justify-content-between">
          <a href="./iims-salt-manufacturing.html" class="text-nowrap logo-img text-primary fw-bold fs-6 ps-3">
            IIMS
          </a>

            <i class="ti ti-x"></i>
          </a>
        </div>
      <nav class="sidebar-nav scroll-sidebar" data-simplebar><ul id="sidebarnav">
        <!-- Sidebar items injected by _role.js -->
      </ul></nav>
    </div></aside>

    <div class="page-wrapper">
      <header class="topbar"><div class="with-vertical"><nav class="navbar navbar-expand-lg p-0"><ul class="navbar-nav"><li class="nav-item nav-icon-hover-bg rounded-circle ms-n2"><a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)"><i class="ti ti-menu-2"></i></a></li></ul><div class="d-block d-lg-none py-4 text-primary fw-bold fs-5 ps-3">IIMS</div><a class="navbar-toggler p-0 border-0 nav-icon-hover-bg rounded-circle" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#navbarNav"><i class="ti ti-dots fs-7"></i></a><div class="collapse navbar-collapse justify-content-end" id="navbarNav"><div class="d-flex align-items-center justify-content-between"><ul class="navbar-nav flex-row ms-auto align-items-center"><li class="nav-item"><img src="../../assets/images/profile/user-1.jpg" class="rounded-circle" width="35" height="35" alt="" /></li></ul></div></div></nav></div></header>

      <div class="body-wrapper">
        <div class="container-fluid">
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3"><div class="row align-items-center"><div class="col-9"><h4 class="fw-semibold mb-8">Multiple Brands Registration (Water)</h4><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a class="text-muted" href="./iims-bottled-water.html">Water Module</a></li><li class="breadcrumb-item active">New Brand</li></ol></nav></div></div></div>
          </div>

          <div class="card">
            <div class="card-body">
              <h5 class="fw-semibold mb-4 text-primary">Associate New Brand with Existing Profile</h5>
              <form onsubmit="event.preventDefault(); alert('New water brand registration submitted successfully!');">
                <div class="row g-3">
                  <div class="col-md-12">
                    <label class="form-label">Parent Company Profile <span class="text-danger">*</span></label>
                    <select class="form-select border-primary">
                      <option selected>Aqua Pure Pvt Ltd (FBO-2026-0045)</option>
                      <option>Natural Waters SL (FBO-2026-0012)</option>
                    </select>
                  </div>

                  <div class="col-md-6"><label class="form-label">Brand Name <span class="text-danger">*</span></label><input type="text" class="form-control" placeholder="e.g. Blue Lagoon"></div>
                  <div class="col-md-6"><label class="form-label">Product Range</label><input type="text" class="form-control" placeholder="e.g. 500ml, 1L, 5L PET Bottles"></div>

                  <div class="col-md-12 mt-4">
                    <div class="p-3 bg-secondary-subtle rounded border d-flex justify-content-between align-items-center">
                      <div>
                        <h6 class="fw-bold mb-0">Reuse Technical Infrastructure Documents?</h6>
                        <small class="text-muted">Link this brand to already verified water source (Deep Tube Well #1) and SLSI facility audit.</small>
                      </div>
                      <div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked style="width: 40px; height: 20px;"></div>
                    </div>
                  </div>

                  <div class="col-md-12 mt-4">
                    <h6 class="fw-semibold text-danger">New Brand-Specific Requirements</h6>
                    <div class="row g-3 mt-1">
                      <div class="col-md-6"><label class="form-label">Upload Label Specimen (Front)</label><input type="file" class="form-control"></div>
                      <div class="col-md-6"><label class="form-label">Upload Label Specimen (Back)</label><input type="file" class="form-control"></div>
                    </div>
                  </div>

                  <div class="col-12 mt-4 text-end">
                    <button type="submit" class="btn btn-primary px-4"><i class="ti ti-plus me-1"></i>Register Brand</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
