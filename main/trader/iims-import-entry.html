<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light" data-color-theme="Blue_Theme" data-layout="vertical">
<head>
  <meta charset="UTF-8" /><meta http-equiv="X-UA-Compatible" content="IE=edge" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" type="image/png" href="../../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <title>IIMS - Pre-Import Entry List</title>
</head>
<body class="link-sidebar">
  <div class="preloader"><img src="../../assets/images/logos/favicon.png" alt="loader" class="lds-ripple img-fluid" /></div>
  <div id="main-wrapper">
    <aside class="left-sidebar with-vertical"><div>
      <div class="brand-logo d-flex align-items-center justify-content-between">
          <a href="./iims-export-app.html" class="text-nowrap logo-img text-primary fw-bold fs-6 ps-3">
            IIMS
          </a>
          <a href="javascript:void(0)" class="sidebartoggler ms-auto text-decoration-none fs-5 d-block d-xl-none">
            <i class="ti ti-x"></i>
          </a>
        </div>
      <nav class="sidebar-nav scroll-sidebar" data-simplebar><ul id="sidebarnav"></ul></nav>
    </div></aside>

    <div class="page-wrapper">
      <header class="topbar"><div class="with-vertical"><nav class="navbar navbar-expand-lg p-0"><ul class="navbar-nav"><li class="nav-item nav-icon-hover-bg rounded-circle ms-n2"><a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)"><i class="ti ti-menu-2"></i></a></li></ul><div class="d-block d-lg-none py-4 text-primary fw-bold fs-5 ps-3">IIMS</div><a class="navbar-toggler p-0 border-0 nav-icon-hover-bg rounded-circle" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#navbarNav"><i class="ti ti-dots fs-7"></i></a><div class="collapse navbar-collapse justify-content-end" id="navbarNav"><div class="d-flex align-items-center justify-content-between"><ul class="navbar-nav flex-row ms-auto align-items-center"><li class="nav-item"><img src="../../assets/images/profile/user-1.jpg" class="rounded-circle" width="35" height="35" alt="" /></li></ul></div></div></nav></div></header>

      <div class="body-wrapper">
        <div class="container-fluid">
          
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3">
              <div class="row align-items-center">
                <div class="col-9">
                  <h4 class="fw-semibold mb-8">Pre-Import Entry</h4>
                  <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-export-app.html">Home</a></li>
                      <li class="breadcrumb-item active">Pre-Import Entry</li>
                    </ol>
                  </nav>
                </div>
              </div>
            </div>
          </div>

          <!-- Filters Section -->
          <div class="card border-0 shadow-sm mb-4">
            <div class="card-body py-3">
              <div class="row align-items-end g-3">
                <div class="col-lg-6">
                  <label class="form-label fw-semibold">Search</label>
                  <input type="text" id="search-input" class="form-control" placeholder="Search by FCAU No.., CUSDEC No.., Food Category, Status...">
                </div>
                <div class="col-lg-3">
                  <label class="form-label fw-semibold">Rows Per Page</label>
                  <select id="rows-per-page" class="form-select">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                  </select>
                </div>
                <div class="col-lg-3">
                  <button class="btn btn-primary w-100" onclick="applySearch()"><i class="ti ti-filter me-1"></i>Filter</button>
                </div>
              </div>
            </div>
          </div>

          <!-- List Section -->
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="d-flex align-items-center gap-2">
                  <div class="bg-primary-subtle text-primary p-2 rounded">
                    <i class="ti ti-package fs-6"></i>
                  </div>
                  <h5 class="fw-semibold mb-0 text-dark">My Pre-Import Entries</h5>
                </div>
                <button class="btn btn-primary" onclick="window.location.href='./iims-add-import-entry.html'"><i class="ti ti-plus me-1"></i>Add Pre-Import Entry</button>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th width="40">#</th>
                      <th>FCAU No.</th>
                      <th>CUSDEC No.</th>
                      <th>Food Category</th>
                      <th>Food Subcategory</th>
                      <th>HS Code</th>
                      <th>Doc. Verification Status</th>
                      <th>Payment Status</th>
                      <th class="text-end">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="entries-tbody">
                    <!-- Rendered by JS -->
                  </tbody>
                </table>
              </div>
              
              <div class="d-flex justify-content-between align-items-center mt-3">
                <span class="fs-2 text-muted" id="table-showing">Showing 1-4 of 4 entries</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/vendor.min.js"></script>
  <script src="../../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/simplebar/dist/simplebar.min.js"></script>
  <script src="../../assets/js/theme/app.init.js"></script>
  <script src="../../assets/js/theme/theme.js"></script>
  <script src="../../assets/js/theme/app.min.js"></script>
  <script src="../../assets/js/theme/sidebarmenu.js"></script>
  <script src="./_role.js"></script>

  <script>
    var entries = [
      { id: "I-XORKSO", cusdec: "123", category: "Dairy Processing", subcategory: "Ice Cream Factory", hs: "0904.22.10", docStatus: "Approved", payStatus: "Unpaid" },
      { id: "I-DSH0QQ", cusdec: "123", category: "Bakeries", subcategory: "Pastry Shop", hs: "0904.22.10", docStatus: "Pending", payStatus: "Unpaid" },
      { id: "I-LDC5PK", cusdec: "54321", category: "Food Packaging", subcategory: "Secondary Packaging", hs: "1806.90.00", docStatus: "Approved", payStatus: "Paid" },
      { id: "I-G0BNCY", cusdec: "766", category: "Food Packaging", subcategory: "Primary Packaging", hs: "0904.11.00", docStatus: "Approved", payStatus: "Paid" }
    ];

    function renderEntries(data) {
      var tbody = document.getElementById('entries-tbody');
      tbody.innerHTML = '';
      data.forEach(function(item, idx) {
        var tr = document.createElement('tr');
        
        var docBadge = item.docStatus === 'Approved' ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-muted';
        var payBadge = item.payStatus === 'Paid' ? 'bg-success-subtle text-success' : 'bg-info-subtle text-info';

        var payActionBtn = item.payStatus === 'Unpaid' 
          ? '<button class="btn btn-sm btn-success px-2 me-1" title="Pay Now" onclick="payEntry(\'' + item.id + '\')"><i class="ti ti-credit-card fs-3"></i></button>' 
          : '';

        tr.innerHTML = '<td><span class="text-muted">' + (idx + 1) + '</span></td>' +
          '<td><a href="./iims-add-import-entry.html" class="fw-semibold text-primary">' + item.id + '</a></td>' +
          '<td><span class="fw-semibold text-dark fs-2">' + item.cusdec + '</span></td>' +
          '<td><span class="fw-semibold text-dark fs-2">' + item.category + '</span></td>' +
          '<td><span class="text-muted fs-2">' + item.subcategory + '</span></td>' +
          '<td><span class="fw-bold text-dark fs-2">' + item.hs + '</span></td>' +
          '<td><span class="badge ' + docBadge + ' fw-semibold fs-1 px-3 py-1 rounded">' + item.docStatus + '</span></td>' +
          '<td><span class="badge ' + payBadge + ' fw-semibold fs-1 px-3 py-1 rounded">' + item.payStatus + '</span></td>' +
          '<td class="text-end">' +
          '  <div class="d-flex align-items-center justify-content-end">' +
          payActionBtn +
          '    <button class="btn btn-sm btn-primary px-2" title="View Details"><i class="ti ti-eye fs-3"></i></button>' +
          '  </div>' +
          '</td>';
        tbody.appendChild(tr);
      });
      document.getElementById('table-showing').textContent = 'Showing 1-' + data.length + ' of ' + data.length + ' entries';
    }

    function applySearch() {
      var query = document.getElementById('search-input').value.toLowerCase();
      var filtered = entries.filter(function(item) {
        return item.id.toLowerCase().includes(query) || 
               item.cusdec.toLowerCase().includes(query) || 
               item.category.toLowerCase().includes(query) || 
               item.subcategory.toLowerCase().includes(query) || 
               item.docStatus.toLowerCase().includes(query);
      });
      renderEntries(filtered);
    }

    function payEntry(id) {
      var item = entries.find(e => e.id === id);
      if (item) {
        item.payStatus = 'Paid';
        alert("Payment for entry " + id + " submitted successfully!");
        renderEntries(entries);
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      renderEntries(entries);
    });
  </script>
</body>
</html>
