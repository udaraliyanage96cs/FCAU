<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light" data-color-theme="Blue_Theme" data-layout="vertical">
<head>
  <meta charset="UTF-8" /><meta http-equiv="X-UA-Compatible" content="IE=edge" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" type="image/png" href="../../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <title>IIMS - H800 Criteria Domains</title>
</head>
<body class="link-sidebar">
  <div class="preloader"><img src="../../assets/images/logos/favicon.png" alt="loader" class="lds-ripple img-fluid" /></div>
  <div id="main-wrapper">
    <aside class="left-sidebar with-vertical"><div>
      <div class="brand-logo d-flex align-items-center justify-content-between">
        <a href="./iims-dashboard.html" class="text-nowrap logo-img text-primary fw-bold fs-6 ps-3">
          IIMS
        </a>
        <a href="javascript:void(0)" class="sidebartoggler ms-auto text-decoration-none fs-5 d-block d-xl-none">
          <i class="ti ti-x"></i>
        </a>
      </div>
      <nav class="sidebar-nav scroll-sidebar" data-simplebar><ul id="sidebarnav"></ul></nav>
    </div></aside>

    <div class="page-wrapper">
      <header class="topbar"><div class="with-vertical"><nav class="navbar navbar-expand-lg p-0"><ul class="navbar-nav"><li class="nav-item nav-icon-hover-bg rounded-circle ms-n2"><a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)"><i class="ti ti-menu-2"></i></a></li></ul><div class="d-block d-lg-none py-4 text-primary fw-bold fs-5 ps-3">IIMS</div><a class="navbar-toggler p-0 border-0 nav-icon-hover-bg rounded-circle" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#navbarNav"><i class="ti ti-dots fs-7"></i></a><div class="collapse navbar-collapse justify-content-end" id="navbarNav"><div class="d-flex align-items-center justify-content-between"><ul class="navbar-nav flex-row ms-auto align-items-center"><li class="nav-item"><img src="../../assets/images/profile/user-1.jpg" class="rounded-circle" width="35" height="35" alt="" /></li></ul></div></div></nav></div></header>

      <div class="body-wrapper">
        <div class="container-fluid">
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3">
              <div class="row align-items-center">
                <div class="col-9">
                  <h4 class="fw-semibold mb-8">H800 Criteria Domains</h4>
                  <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-dashboard.html">Home</a></li>
                      <li class="breadcrumb-item active">Criteria Domains</li>
                    </ol>
                  </nav>
                </div>
              </div>
            </div>
          </div>

          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                <div>
                  <h5 class="fw-semibold mb-1">H800 Checklist Domains</h5>
                  <p class="text-muted fs-2 mb-0">Manage criteria grouping categories and colors</p>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-2">
                  <div class="position-relative">
                    <input type="text" id="search-input" class="form-control ps-5" placeholder="Search by code or name..." style="width: 220px;">
                    <i class="ti ti-search position-absolute start-0 top-50 translate-middle-y ms-3 text-muted"></i>
                  </div>
                  <select id="filter-color" class="form-select" style="width: 150px;">
                    <option value="">All Themes</option>
                    <option value="primary">Primary</option>
                    <option value="info">Info</option>
                    <option value="warning">Warning</option>
                    <option value="danger">Danger</option>
                    <option value="success">Success</option>
                    <option value="dark">Dark</option>
                  </select>
                  <button class="btn btn-outline-primary" onclick="applyFilters()">Apply</button>
                  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addDomainModal"><i class="ti ti-plus me-1"></i>Add Domain</button>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Domain Code</th>
                      <th>Domain Name</th>
                      <th>Color Theme</th>
                      <th>Status</th>
                      <th class="text-end">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="domains-tbody">
                    <!-- Rendered by JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Domain Modal -->
  <div class="modal fade" id="addDomainModal" tabindex="-1" aria-labelledby="addDomainModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-semibold" id="addDomainModalLabel">Add New H800 Domain</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="add-domain-form" onsubmit="saveDomain(event)">
            <div class="mb-3">
              <label class="form-label fw-semibold">Domain Code</label>
              <input type="text" id="domain-code" class="form-control" placeholder="e.g. SANITATION" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Domain Name</label>
              <input type="text" id="domain-name" class="form-control" placeholder="e.g. Sanitation" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Color Theme</label>
              <select id="domain-theme" class="form-select" required>
                <option value="" disabled selected>Select Color Theme</option>
                <option value="primary">Primary (Blue/Indigo)</option>
                <option value="info">Info (Light Blue)</option>
                <option value="warning">Warning (Orange/Yellow)</option>
                <option value="danger">Danger (Red)</option>
                <option value="success">Success (Green)</option>
                <option value="dark">Dark (Gray/Black)</option>
              </select>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Create Domain</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="dark-transparent sidebartoggler"></div>
  <script src="../../assets/js/vendor.min.js"></script>
  <script src="../../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/simplebar/dist/simplebar.min.js"></script>
  <script src="../../assets/js/theme/app.init.js"></script>
  <script src="../../assets/js/theme/theme.js"></script>
  <script src="../../assets/js/theme/app.min.js"></script>
  <script src="../../assets/js/theme/sidebarmenu.js"></script>
  <script src="./_role.js"></script>

  <script>
    var domains = [
      { code: "BUILDING", name: "Building", theme: "info", status: "Active" },
      { code: "FOOD_HANDLER", name: "Food Handler", theme: "warning", status: "Active" },
      { code: "GENERAL", name: "General", theme: "primary", status: "Active" },
      { code: "NEWDOMAIN", name: "NEWDOMAIN", theme: "primary", status: "Active" },
      { code: "PROCESSING", name: "Processing", theme: "danger", status: "Active" },
      { code: "SANITATION", name: "Sanitation", theme: "dark", status: "Active" },
      { code: "STORAGE", name: "Storage", theme: "success", status: "Active" }
    ];

    function renderDomains(data) {
      var tbody = document.getElementById('domains-tbody');
      tbody.innerHTML = '';
      data.forEach(function(item) {
        var tr = document.createElement('tr');
        
        var themeBadge = 'bg-primary-subtle text-primary';
        if (item.theme === 'info') themeBadge = 'bg-info-subtle text-info';
        if (item.theme === 'warning') themeBadge = 'bg-warning-subtle text-warning';
        if (item.theme === 'danger') themeBadge = 'bg-danger-subtle text-danger';
        if (item.theme === 'success') themeBadge = 'bg-success-subtle text-success';
        if (item.theme === 'dark') themeBadge = 'bg-dark-subtle text-dark';

        tr.innerHTML = '<td><span class="text-primary fw-semibold">' + item.code + '</span></td>' +
          '<td><span class="fw-semibold text-dark">' + item.name + '</span></td>' +
          '<td><span class="badge ' + themeBadge + ' fw-semibold fs-1 px-3 py-1 rounded">' + item.theme + '</span></td>' +
          '<td><span class="text-success fw-semibold fs-2">' + item.status + '</span></td>' +
          '<td class="text-end">' +
          '  <div class="d-flex align-items-center justify-content-end gap-1">' +
          '    <button class="btn btn-sm btn-info px-2" title="Edit"><i class="ti ti-edit fs-3"></i></button>' +
          '    <button class="btn btn-sm btn-warning px-2" title="Toggle Status"><i class="ti ti-key fs-3"></i></button>' +
          '  </div>' +
          '</td>';
        tbody.appendChild(tr);
      });
    }

    function applyFilters() {
      var query = document.getElementById('search-input').value.toLowerCase();
      var theme = document.getElementById('filter-color').value;

      var filtered = domains.filter(function(item) {
        var matchesQuery = item.name.toLowerCase().includes(query) || item.code.toLowerCase().includes(query);
        var matchesTheme = theme === '' || item.theme === theme;
        return matchesQuery && matchesTheme;
      });
      renderDomains(filtered);
    }

    function saveDomain(e) {
      e.preventDefault();
      var code = document.getElementById('domain-code').value.toUpperCase().replace(/\s+/g, '_');
      var name = document.getElementById('domain-name').value;
      var theme = document.getElementById('domain-theme').value;

      var newDomain = {
        code: code,
        name: name,
        theme: theme,
        status: "Active"
      };

      domains.push(newDomain);

      // Hide modal
      var modalEl = document.getElementById('addDomainModal');
      var modal = bootstrap.Modal.getInstance(modalEl);
      modal.hide();

      // Reset form
      document.getElementById('add-domain-form').reset();

      renderDomains(domains);
    }

    // Initial render
    window.addEventListener('DOMContentLoaded', function() {
      renderDomains(domains);
    });
  </script>
</body>
</html>
