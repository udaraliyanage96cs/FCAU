<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light" data-color-theme="Blue_Theme" data-layout="vertical">
<head>
  <meta charset="UTF-8" /><meta http-equiv="X-UA-Compatible" content="IE=edge" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" type="image/png" href="../../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <title>IIMS - H800 Criteria Config</title>
</head>
<body class="link-sidebar">
  <div class="preloader"><img src="../../assets/images/logos/favicon.png" alt="loader" class="lds-ripple img-fluid" /></div>
  <div id="main-wrapper">
    <aside class="left-sidebar with-vertical"><div>
      <div class="brand-logo d-flex align-items-center justify-content-between">
        <a href="./iims-dashboard.html" class="text-nowrap logo-img text-primary fw-bold fs-6 ps-3">
          IIMS
        </a>
        <a href="javascript:void(0)" class="sidebartoggler ms-auto text-decoration-none fs-5 d-block d-xl-none">
          <i class="ti ti-x"></i>
        </a>
      </div>
      <nav class="sidebar-nav scroll-sidebar" data-simplebar><ul id="sidebarnav"></ul></nav>
    </div></aside>

    <div class="page-wrapper">
      <header class="topbar"><div class="with-vertical"><nav class="navbar navbar-expand-lg p-0"><ul class="navbar-nav"><li class="nav-item nav-icon-hover-bg rounded-circle ms-n2"><a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)"><i class="ti ti-menu-2"></i></a></li></ul><div class="d-block d-lg-none py-4 text-primary fw-bold fs-5 ps-3">IIMS</div><a class="navbar-toggler p-0 border-0 nav-icon-hover-bg rounded-circle" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#navbarNav"><i class="ti ti-dots fs-7"></i></a><div class="collapse navbar-collapse justify-content-end" id="navbarNav"><div class="d-flex align-items-center justify-content-between"><ul class="navbar-nav flex-row ms-auto align-items-center"><li class="nav-item"><img src="../../assets/images/profile/user-1.jpg" class="rounded-circle" width="35" height="35" alt="" /></li></ul></div></div></nav></div></header>

      <div class="body-wrapper">
        <div class="container-fluid">
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3">
              <div class="row align-items-center">
                <div class="col-9">
                  <h4 class="fw-semibold mb-8">H800 Criteria Management</h4>
                  <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-dashboard.html">Home</a></li>
                      <li class="breadcrumb-item active">H800 Criteria Management</li>
                    </ol>
                  </nav>
                </div>
              </div>
            </div>
          </div>

          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                <div>
                  <h5 class="fw-semibold mb-1">H800 Checklist Criteria</h5>
                  <p class="text-muted fs-2 mb-0">Manage inspection criteria items</p>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-2">
                  <div class="position-relative">
                    <input type="text" id="search-input" class="form-control ps-5" placeholder="Search by ID or description..." style="width: 230px;">
                    <i class="ti ti-search position-absolute start-0 top-50 translate-middle-y ms-3 text-muted"></i>
                  </div>
                  <select id="filter-domain" class="form-select" style="width: 160px;">
                    <option value="">All Domains</option>
                    <option value="Building">Building</option>
                    <option value="Food Handler">Food Handler</option>
                    <option value="General">General</option>
                  </select>
                  <button class="btn btn-outline-primary" onclick="applyFilters()">Apply</button>
                  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCriteriaModal"><i class="ti ti-plus me-1"></i>Add Criteria</button>
                </div>
              </div>

              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Criteria ID</th>
                      <th>Domain</th>
                      <th>Description</th>
                      <th>Scores</th>
                      <th>Status</th>
                      <th class="text-end">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="criteria-tbody">
                    <!-- Rendered by JS -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Criteria Modal -->
  <div class="modal fade" id="addCriteriaModal" tabindex="-1" aria-labelledby="addCriteriaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-semibold" id="addCriteriaModalLabel">Add New H800 Criteria</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="add-criteria-form" onsubmit="saveCriteria(event)">
            <div class="mb-3">
              <label class="form-label fw-semibold">Criteria ID</label>
              <input type="text" id="crit-id" class="form-control" placeholder="e.g. BLD-04 or CRI-00124" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Domain</label>
              <select id="crit-domain" class="form-select" required>
                <option value="" disabled selected>Select Domain</option>
                <option value="Building">Building</option>
                <option value="Food Handler">Food Handler</option>
                <option value="General">General</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea id="crit-desc" class="form-control" rows="2" placeholder="e.g. Structural soundness, proper drainage..." required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Scores (Comma separated)</label>
              <input type="text" id="crit-scores" class="form-control" placeholder="e.g. 1, 2, 5 (Optional)">
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Create Criteria</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="dark-transparent sidebartoggler"></div>
  <script src="../../assets/js/vendor.min.js"></script>
  <script src="../../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/simplebar/dist/simplebar.min.js"></script>
  <script src="../../assets/js/theme/app.init.js"></script>
  <script src="../../assets/js/theme/theme.js"></script>
  <script src="../../assets/js/theme/app.min.js"></script>
  <script src="../../assets/js/theme/sidebarmenu.js"></script>
  <script src="./_role.js"></script>

  <script>
    var criteriaList = [
      { id: "BLD-01", domain: "Building", domainTheme: "info", desc: "Structural soundness", scores: "1,2,5", status: "Active" },
      { id: "BLD-02", domain: "Building", domainTheme: "info", desc: "Adequate working space", scores: "1,3,6", status: "Active" },
      { id: "BLD-03", domain: "Building", domainTheme: "info", desc: "Lighting and ventilation", scores: "", status: "Active" },
      { id: "CRI-00112", domain: "Food Handler", domainTheme: "warning", desc: "Food", scores: "1,2,3", status: "Active" },
      { id: "CRI-00123", domain: "Food Handler", domainTheme: "warning", desc: "Food wewef", scores: "1,2", status: "Active" },
      { id: "CRI-00123Q2", domain: "Food Handler", domainTheme: "warning", desc: "Food wewef", scores: "1,2", status: "Active" },
      { id: "GEN-01", domain: "General", domainTheme: "primary", desc: "Freedom from industrial pollution", scores: "", status: "Active" },
      { id: "GEN-02", domain: "General", domainTheme: "primary", desc: "Freedom from objectionable odors", scores: "", status: "Active" }
    ];

    function renderCriteria(data) {
      var tbody = document.getElementById('criteria-tbody');
      tbody.innerHTML = '';
      data.forEach(function(item) {
        var tr = document.createElement('tr');
        
        var themeBadge = 'bg-primary-subtle text-primary';
        if (item.domainTheme === 'info') themeBadge = 'bg-info-subtle text-info';
        if (item.domainTheme === 'warning') themeBadge = 'bg-warning-subtle text-warning';
        if (item.domainTheme === 'danger') themeBadge = 'bg-danger-subtle text-danger';
        if (item.domainTheme === 'success') themeBadge = 'bg-success-subtle text-success';
        if (item.domainTheme === 'dark') themeBadge = 'bg-dark-subtle text-dark';

        tr.innerHTML = '<td><span class="text-primary fw-semibold">' + item.id + '</span></td>' +
          '<td><span class="badge ' + themeBadge + ' fw-semibold fs-1 px-3 py-1 rounded">' + item.domain + '</span></td>' +
          '<td><span class="fw-semibold text-dark fs-2">' + item.desc + '</span></td>' +
          '<td><span class="fw-bold text-muted fs-2">' + (item.scores || '-') + '</span></td>' +
          '<td><span class="text-success fw-semibold fs-2">' + item.status + '</span></td>' +
          '<td class="text-end">' +
          '  <div class="d-flex align-items-center justify-content-end gap-1">' +
          '    <button class="btn btn-sm btn-info px-2" title="Edit"><i class="ti ti-edit fs-3"></i></button>' +
          '    <button class="btn btn-sm btn-warning px-2" title="Toggle Status"><i class="ti ti-key fs-3"></i></button>' +
          '  </div>' +
          '</td>';
        tbody.appendChild(tr);
      });
    }

    function applyFilters() {
      var query = document.getElementById('search-input').value.toLowerCase();
      var domain = document.getElementById('filter-domain').value;

      var filtered = criteriaList.filter(function(item) {
        var matchesQuery = item.id.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
        var matchesDomain = domain === '' || item.domain === domain;
        return matchesQuery && matchesDomain;
      });
      renderCriteria(filtered);
    }

    function saveCriteria(e) {
      e.preventDefault();
      var id = document.getElementById('crit-id').value;
      var domain = document.getElementById('crit-domain').value;
      var desc = document.getElementById('crit-desc').value;
      var scores = document.getElementById('crit-scores').value;

      var domainTheme = 'primary';
      if (domain === 'Building') domainTheme = 'info';
      if (domain === 'Food Handler') domainTheme = 'warning';

      var newCriteria = {
        id: id,
        domain: domain,
        domainTheme: domainTheme,
        desc: desc,
        scores: scores,
        status: "Active"
      };

      criteriaList.push(newCriteria);

      // Hide modal
      var modalEl = document.getElementById('addCriteriaModal');
      var modal = bootstrap.Modal.getInstance(modalEl);
      modal.hide();

      // Reset form
      document.getElementById('add-criteria-form').reset();

      renderCriteria(criteriaList);
    }

    // Initial render
    window.addEventListener('DOMContentLoaded', function() {
      renderCriteria(criteriaList);
    });
  </script>
</body>
</html>
