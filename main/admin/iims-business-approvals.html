<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light" data-color-theme="Blue_Theme" data-layout="vertical">
<head>
  <meta charset="UTF-8" /><meta http-equiv="X-UA-Compatible" content="IE=edge" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" type="image/png" href="../../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <title>IIMS - Corporate Business Approvals</title>
</head>
<body class="link-sidebar">
  <div class="preloader"><img src="../../assets/images/logos/favicon.png" alt="loader" class="lds-ripple img-fluid" /></div>
  <div id="main-wrapper">
    <aside class="left-sidebar with-vertical"><div>
        <div class="brand-logo d-flex align-items-center justify-content-between">
          <a href="./iims-dashboard.html" class="text-nowrap logo-img text-primary fw-bold fs-6 ps-3">
            IIMS
          </a>
          <a href="javascript:void(0)" class="sidebartoggler ms-auto text-decoration-none fs-5 d-block d-xl-none">
            <i class="ti ti-x"></i>
          </a>
        </div>
      <nav class="sidebar-nav scroll-sidebar" data-simplebar><ul id="sidebarnav">
        <!-- Loaded by _role.js -->
      </ul></nav>
    </div></aside>

    <div class="page-wrapper">
      <header class="topbar"><div class="with-vertical"><nav class="navbar navbar-expand-lg p-0"><ul class="navbar-nav"><li class="nav-item nav-icon-hover-bg rounded-circle ms-n2"><a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)"><i class="ti ti-menu-2"></i></a></li></ul><div class="d-block d-lg-none py-4 text-primary fw-bold fs-5 ps-3">IIMS</div><a class="navbar-toggler p-0 border-0 nav-icon-hover-bg rounded-circle" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#navbarNav"><i class="ti ti-dots fs-7"></i></a><div class="collapse navbar-collapse justify-content-end" id="navbarNav"><div class="d-flex align-items-center justify-content-between"><ul class="navbar-nav flex-row ms-auto align-items-center"><li class="nav-item"><img src="../../assets/images/profile/user-1.jpg" class="rounded-circle" width="35" height="35" alt="" /></li></ul></div></div></nav></div></header>

      <div class="body-wrapper">
        <div class="container-fluid">
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3"><div class="row align-items-center"><div class="col-9"><h4 class="fw-semibold mb-8">Corporate Business Approvals</h4><nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a class="text-muted" href="./iims-dashboard.html">Home</a></li><li class="breadcrumb-item active">Business Approvals</li></ol></nav></div></div></div>
          </div>

          <div class="card">
            <div class="card-body">
              <h5 class="card-title fw-semibold mb-3">FCAU Officer - Corporate Business Approval Queue</h5>
              <p class="card-subtitle text-muted mb-4">Review and approve new parent business entities registered by Food Business Operators.</p>
              
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Business Name</th>
                      <th>Registration Number</th>
                      <th>Current Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="admin-business-queue-body">
                    <!-- Dynamic -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="dark-transparent sidebartoggler"></div>
  <script src="../../assets/js/vendor.min.js"></script>
  <script src="../../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/simplebar/dist/simplebar.min.js"></script>
  <script src="../../assets/js/theme/app.init.js"></script>
  <script src="../../assets/js/theme/theme.js"></script>
  <script src="../../assets/js/theme/app.min.js"></script>
  <script src="../../assets/js/theme/sidebarmenu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>

  <script>
    function initData() {
      if (!localStorage.getItem('fcau_businesses')) {
        const initialBusinesses = [
          { id: "bus-1", name: "Golden Rice Corp", regNo: "BR-1001", status: "Approved" },
          { id: "bus-2", name: "Silver Spoon Group", regNo: "BR-1002", status: "Pending Approval" }
        ];
        localStorage.setItem('fcau_businesses', JSON.stringify(initialBusinesses));
      }
    }

    function renderBusinessQueue() {
      initData();
      const tbody = document.getElementById('admin-business-queue-body');
      if (!tbody) return;
      tbody.innerHTML = '';
      
      const businesses = JSON.parse(localStorage.getItem('fcau_businesses')) || [];
      const pending = businesses.filter(b => b.status === 'Pending Approval');
      
      if (pending.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">No pending businesses awaiting approval.</td></tr>`;
        return;
      }
      
      pending.forEach(b => {
        tbody.innerHTML += `
          <tr>
            <td><span class="fw-semibold text-dark">${b.name}</span></td>
            <td><code>${b.regNo}</code></td>
            <td><span class="badge bg-warning">${b.status}</span></td>
            <td>
              <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-sm btn-success" onclick="approveBusiness('${b.id}')"><i class="ti ti-check me-1"></i>Approve</button>
                <button class="btn btn-sm btn-outline-danger" onclick="rejectBusiness('${b.id}')"><i class="ti ti-x me-1"></i>Reject</button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    window.approveBusiness = function(id) {
      const businesses = JSON.parse(localStorage.getItem('fcau_businesses')) || [];
      const idx = businesses.findIndex(b => b.id === id);
      if (idx !== -1) {
        businesses[idx].status = 'Approved';
        localStorage.setItem('fcau_businesses', JSON.stringify(businesses));
        alert('Business approved successfully! It is now active and visible to MOH.');
        renderBusinessQueue();
      }
    };

    window.rejectBusiness = function(id) {
      if (confirm('Are you sure you want to reject this business registration?')) {
        let businesses = JSON.parse(localStorage.getItem('fcau_businesses')) || [];
        businesses = businesses.filter(b => b.id !== id);
        localStorage.setItem('fcau_businesses', JSON.stringify(businesses));
        renderBusinessQueue();
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      renderBusinessQueue();
    });
  </script>
  <script src="./_role.js"></script>
</body>
</html>
