<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light" data-color-theme="Blue_Theme" data-layout="vertical">
<head>
  <meta charset="UTF-8" /><meta http-equiv="X-UA-Compatible" content="IE=edge" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" type="image/png" href="../../assets/images/logos/favicon.png" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <title>IIMS - Update Laboratory Details</title>
</head>
<body class="link-sidebar">
  <div class="preloader"><img src="../../assets/images/logos/favicon.png" alt="loader" class="lds-ripple img-fluid" /></div>
  <div id="main-wrapper">
    <aside class="left-sidebar with-vertical"><div>
        <div class="brand-logo d-flex align-items-center justify-content-between">
          <a href="./iims-dashboard.html" class="text-nowrap logo-img text-primary fw-bold fs-6 ps-3">
            IIMS
          </a>
          <a href="javascript:void(0)" class="sidebartoggler ms-auto text-decoration-none fs-5 d-block d-xl-none">
            <i class="ti ti-x"></i>
          </a>
        </div>
      <nav class="sidebar-nav scroll-sidebar" data-simplebar><ul id="sidebarnav"></ul></nav>
    </div></aside>

    <div class="page-wrapper">
      <header class="topbar"><div class="with-vertical"><nav class="navbar navbar-expand-lg p-0"><ul class="navbar-nav"><li class="nav-item nav-icon-hover-bg rounded-circle ms-n2"><a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)"><i class="ti ti-menu-2"></i></a></li></ul><div class="d-block d-lg-none py-4 text-primary fw-bold fs-5 ps-3">IIMS</div><a class="navbar-toggler p-0 border-0 nav-icon-hover-bg rounded-circle" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#navbarNav"><i class="ti ti-dots fs-7"></i></a><div class="collapse navbar-collapse justify-content-end" id="navbarNav"><div class="d-flex align-items-center justify-content-between"><ul class="navbar-nav flex-row ms-auto align-items-center"><li class="nav-item"><img src="../../assets/images/profile/user-1.jpg" class="rounded-circle" width="35" height="35" alt="" /></li></ul></div></div></nav></div></header>

      <div class="body-wrapper">
        <div class="container-fluid">
          <!-- Breadcrumb Header -->
          <div class="card bg-info-subtle shadow-none position-relative overflow-hidden mb-4">
            <div class="card-body px-4 py-3">
              <div class="row align-items-center">
                <div class="col-9">
                  <h4 class="fw-semibold mb-8">Update Laboratory Details</h4>
                  <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-dashboard.html">Home</a></li>
                      <li class="breadcrumb-item"><a class="text-muted" href="./iims-labs.html">Laboratory Directory</a></li>
                      <li class="breadcrumb-item active" aria-current="page" id="breadcrumbLabId">Update Laboratory</li>
                    </ol>
                  </nav>
                </div>
              </div>
            </div>
          </div>

          <!-- Edit Lab Form Card -->
          <div class="card">
            <div class="card-body">
              <h5 class="card-title fw-semibold mb-4"><i class="ti ti-edit me-2 text-primary"></i>Modify Laboratory Profile: <span id="titleLabId" class="text-muted">-</span></h5>
              <form id="editLabForm">
                <div class="row g-4">
                  <!-- Section 1: Laboratory Details -->
                  <div class="col-12"><h6 class="fw-bold border-bottom pb-2">1. Institution Specifications</h6></div>
                  <div class="col-md-6">
                    <label class="form-label" for="labName">Laboratory Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="labName" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="labLocation">Location / Address <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="labLocation" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="labCategory">Testing Scope / Category <span class="text-danger">*</span></label>
                    <select class="form-select" id="labCategory" required>
                      <option value="">-- Select Testing Scope --</option>
                      <option value="General Food Safety">General Food Safety</option>
                      <option value="Microbiological Analysis">Microbiological Analysis</option>
                      <option value="Chemical Testing">Chemical Testing</option>
                      <option value="Toxicology & Heavy Metals">Toxicology & Heavy Metals</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="labStatus">Accreditation Status <span class="text-danger">*</span></label>
                    <select class="form-select" id="labStatus" required>
                      <option value="Active">Active / Accredited</option>
                      <option value="Awaiting Accreditation">Awaiting Accreditation</option>
                      <option value="Suspended">Suspended</option>
                    </select>
                  </div>

                  <!-- Section 2: Representative details -->
                  <div class="col-12 mt-4"><h6 class="fw-bold border-bottom pb-2">2. Authorized Representative Contacts</h6></div>
                  <div class="col-md-4">
                    <label class="form-label" for="repName">Representative Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="repName" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="repEmail">Representative Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="repEmail" required>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="repPhone">Representative Phone <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="repPhone" required>
                  </div>

                  <!-- Submit button -->
                  <div class="col-12 mt-4 pt-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i>Save Changes</button>
                    <a href="iims-labs.html" class="btn btn-outline-secondary">Cancel</a>
                  </div>

                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="dark-transparent sidebartoggler"></div>
  <script src="../../assets/js/vendor.min.js"></script>
  <script src="../../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/simplebar/dist/simplebar.min.js"></script>
  <script src="../../assets/js/theme/app.init.js"></script>
  <script src="../../assets/js/theme/theme.js"></script>
  <script src="../../assets/js/theme/app.min.js"></script>
  <script src="../../assets/js/theme/sidebarmenu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Parse Query parameters
      var urlParams = new URLSearchParams(window.location.search);
      var labId = urlParams.get('id');

      if (!labId) {
        alert("No Laboratory ID specified.");
        window.location.href = 'iims-labs.html';
        return;
      }

      var labs = JSON.parse(localStorage.getItem('fcau_iims_labs')) || [];
      var lab = labs.find(function(l) { return l.id === labId; });

      if (!lab) {
        alert("Laboratory " + labId + " not found.");
        window.location.href = 'iims-labs.html';
        return;
      }

      // Pre-fill form
      document.getElementById('breadcrumbLabId').textContent = "Update: " + labId;
      document.getElementById('titleLabId').textContent = labId;
      document.getElementById('labName').value = lab.name;
      document.getElementById('labLocation').value = lab.location;
      document.getElementById('labCategory').value = lab.category;
      document.getElementById('labStatus').value = lab.status;
      document.getElementById('repName').value = lab.repName;
      document.getElementById('repEmail').value = lab.repEmail;
      document.getElementById('repPhone').value = lab.repPhone;

      // Form submit edit
      document.getElementById('editLabForm').addEventListener('submit', function(e) {
        e.preventDefault();

        lab.name = document.getElementById('labName').value.trim();
        lab.location = document.getElementById('labLocation').value.trim();
        lab.category = document.getElementById('labCategory').value;
        lab.status = document.getElementById('labStatus').value;
        lab.repName = document.getElementById('repName').value.trim();
        lab.repEmail = document.getElementById('repEmail').value.trim();
        lab.repPhone = document.getElementById('repPhone').value.trim();

        // Update in localStorage
        var updatedLabs = labs.map(function(item) {
          return item.id === labId ? lab : item;
        });
        localStorage.setItem('fcau_iims_labs', JSON.stringify(updatedLabs));

        window.location.href = 'iims-labs.html?alert=updated';
      });
    });
  </script>
<script src="./_role.js"></script>
</body>
</html>
